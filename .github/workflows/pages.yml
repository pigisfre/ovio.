name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, claude/fervent-einstein-fdsltp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          CI: 1

      - name: Prepare for GitHub Pages
        run: |
          cp dist/index.html dist/404.html   # SPA fallback for deep links
          touch dist/.nojekyll               # keep the _expo folder

      - name: Publish to gh-pages branch
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
